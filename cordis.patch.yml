# dsh-data-mining bundle patch: applied on top of dsh-base in the web/headless
# profile. This layer makes ONE edit:
#
#   inserts the global plugin entry, which registers ONLY the /dm status host
#   command (harmless in every session). The data-mining TOOLS and skills are
#   registered by the preset-only entry (`@deepseek-ai/dsh-data-mining/tools`),
#   mounted by the 数据挖掘模式 agent preset, and the browser dock is
#   preset-gated — so sessions under other presets are untouched.
#
# The data-scientist persona lives in the preset composition
# (`~/.dsh/.agent-presets/data-mining/agent.cordis.yml`), not here.

# Insert the global plugin entry (command only; tools live in the preset).
- insert:
    - id: data-mining
      name: '@deepseek-ai/dsh-data-mining'
